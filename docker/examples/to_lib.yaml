name: Import media to library
delay: 60
priority: 1
steps:

  # data from Jackett
  - name: Collect from Jackett
    module: jackett
    action: get
    input:
      query:
        include: 'HUN'
        seeders: 50
        resolution: '1080p'
  - name: Extend with TMDB data
    module: tmdb
    action: enrich
    input: previous
    config:
      must_match: true

  # data from TMDB
  - name: Collect from TMDB
    module: tmdb
    action: get
  - name: Extend with Jackett data
    module: jackett
    action: enrich
    input: previous
    config:
      must_match: true

  # merge and clean data
  - name: Merge data
    module: tools
    action: remove_duplicates
    input: ["Extend with Jackett data","Extend with TMDB data"]
  - name: Filter out Jellyfin existing media
    module: jellyfin
    action: unique
    input:
      query:
        parentLibrary: Trending
        isInverse: true
      data: previous

  - name: Export to library
    module: library
    action: put
    input: previous