name: Import media to library
delay: 60
priority: 1
steps:

  - name: Collect from Jackett
    module: jackett
    action: get
    input:
      query:
        include: 'HUN'
        seeders: 40
        resolution: '1080p'
  - name: Extend with TMDB data
    module: tmdb
    action: enrich
    input: previous
    config:
      must_match: true

  - name: Collect from TMDB
    module: tmdb
    action: get
  - name: Extend with Jackett data
    module: jackett
    action: enrich
    input: previous
    config:
      must_match: true

  - name: Merge data Jackett and TMDb data
    module: tools
    action: remove_duplicates
    input: ["Extend with Jackett data","Extend with TMDB data"]

  # TODO: need to fix inverse logic
  # - name: Filter out Jellyfin existing media
  #   module: jellyfin
  #   action: unique
  #   input:
  #     data: previous
  #     query:
  #       parentLibrary: Trending
  #       isInverse: true

  - name: Exclude items by ID
    module: tmdb
    action: exclude
    input:
      data: previous
      query:
        imdb_ids: [295701]

  - name: Export to library
    module: library
    action: put
    input: previous