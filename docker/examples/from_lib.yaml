name: Library clean up and P2P task
delay: 15  # minutes
priority: 1
steps:

  - name: Collect Jellyfin favorites
    module: jellyfin
    action: get
    input:
      query:
        parentLibrary: "Trending Filmek"
        isFavorite: true
        allUsers: true
  # Resolve Jellyfin's localized display title through TMDb before searching
  # Jackett. This uses the item's TMDb ID and the configured tmdb.language.
  - name: Normalize titles with TMDb
    module: tmdb
    action: enrich
    input: previous
    config:
      must_match: true
  - name: Add Jackett data
    module: jackett
    action: enrich
    input: previous
    config:
      must_match: true
  - name: Add to Transmission
    module: transmission
    action: put
    input: previous
