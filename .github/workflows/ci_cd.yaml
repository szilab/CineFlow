name: CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh
      - name: Run tests
        run: ./.github/scripts/test.sh
      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh
      - name: Run build
        run: ./.github/scripts/python-build.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/
          retention-days: 15

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Build standalone executable
        run: uv run pyinstaller --clean --noconfirm packaging/windows/CineFlow.spec
      - name: Smoke-test executable
        run: .\dist\CineFlow.exe --version
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-windows-x64
          path: dist/CineFlow.exe
          if-no-files-found: error
          retention-days: 15

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-windows]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cineflow-windows-x64
          path: dist/
      - name: Name Windows release executable
        run: mv dist/CineFlow.exe dist/CineFlow-windows-x64.exe
      - name: Get version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: dist/CineFlow-windows-x64.exe
          generate_release_notes: true

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh
      - name: Build and push Docker image
        run: |
          ./.github/scripts/docker-build.sh --push
