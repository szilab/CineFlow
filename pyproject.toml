[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cineflow"
dynamic = ["version"]
description = "A workflow automation system for media processing"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Sandor Szilagyi" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32.3",
    "pillow>=11.2.1",
]

[project.urls]
Repository = "https://github.com/szilab/CineFlow"

[project.scripts]
cineflow = "cineflow.main:main"

[dependency-groups]
dev = [
    "build",
    "flake8",
    "pylint",
    "pytest",
    "pytest-cov",
    "twine",
]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[^\\s]+)$"

[tool.coverage.run]
source = ["cineflow"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
